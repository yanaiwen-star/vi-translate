<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>悦迅越南语实时同传</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260522-github-social-chip" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></svg>
          </span>
          <div class="brand-text">
            <h1>悦迅越南语实时同传</h1>
            <p class="brand-sub">面对面 · 中文 ⇄ 越南语 双向实时互译</p>
            <nav class="mode-tabs" aria-label="演示模式">
              <button id="micTab" class="mode-tab active" type="button">麦克风</button>
              <button id="cameraTab" class="mode-tab" type="button">摄像头</button>
            </nav>
          </div>
        </div>
        <div class="status-pill">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">待机</span>
        </div>
      </header>

      <section id="workspace" class="workspace">
        <article id="cameraPanel" class="panel camera-panel" hidden>
          <div class="panel-label">摄像头画面</div>
          <div class="camera-stage">
            <video id="cameraPreview" autoplay muted playsinline></video>
            <div id="cameraSubtitle" class="camera-subtitle">译文将显示在这里。</div>
          </div>
        </article>
        <article class="panel">
          <div class="panel-label">原文</div>
          <div id="sourceText" class="live-text placeholder">点击「开始」后，对着麦克风说话。</div>
        </article>
        <article class="panel translation-panel">
          <div class="panel-label">译文</div>
          <div id="translationText" class="live-text translation-text placeholder">译文将显示在这里。</div>
        </article>
      </section>

      <section id="audioRecord" class="audio-record" hidden>
        <div class="audio-record-icon">♪</div>
        <div class="audio-record-meta">
          <div class="audio-record-title">翻译语音记录</div>
          <div id="audioRecordDetails" class="audio-record-details">停止后可用</div>
        </div>
        <audio id="audioRecordPlayer" controls></audio>
      </section>

      <section class="controls">
        <div class="control-group credentials-group" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <span id="accountEmail" style="font-size:13px;color:#555">未登录</span>
          <button id="loginBtn" type="button" style="padding:8px 14px;border-radius:10px;background:#07C160;color:#fff;border:none;cursor:pointer;font-size:13px">登录 / 注册</button>
        </div>
            <label>
            区域
            <select id="region">
              <option value="mainland" selected>Chinese mainland</option>
              <option value="intl">Singapore / Intl</option>
            </select>
          </label>
        </div>
        <div class="settings-group">
          <div class="control-group language-group">
              <label>
              源语言
              <select id="sourceLanguage"></select>
            </label>
              <label>
              目标语言
              <select id="targetLanguage"></select>
            </label>
          </div>
          <div class="control-group visual-group camera-control" hidden>
              <label>
              摄像头
              <select id="cameraDevice"></select>
            </label>
            <label class="toggle camera-control" hidden>
              <input id="visualContextEnabled" type="checkbox" checked />
              <span>视觉上下文</span>
            </label>
              <label class="compact-control">
                帧率
                <select id="frameRate">
                <option value="1" selected>1 fps</option>
                <option value="2">2 fps</option>
              </select>
            </label>
          </div>
          <div class="control-group output-group">
            <div class="output-fields">
              <label class="switch-field">
                <span class="field-label">语音输出</span>
                <span class="toggle compact-toggle output-toggle">
                  <input id="audioEnabled" type="checkbox" checked />
                  <span id="audioToggleText">On</span>
                </span>
              </label>
              <label>
                声音克隆
                <select id="voiceCloneMode">
                  <option value="off" selected>Off</option>
                  <option value="once">Single-speaker clone</option>
                  <option value="always">Multi-speaker clone (per turn)</option>
                </select>
              </label>
              <label>
                发音人
                <select id="voice"></select>
              </label>
            </div>
          </div>
        </div>
        <div class="control-group action-group">
          <button id="startButton" class="primary-action" type="button">开始</button>
          <button id="stopButton" class="danger-action" type="button" disabled>停止</button>
          <button id="clearButton" class="secondary-button" type="button">清空</button>
        </div>
      </section>

      <footer class="meter-row">
        <div class="meter"><div id="levelBar"></div></div>
        <div id="metrics" class="metrics">Model: qwen3.5-livetranslate-flash-realtime</div>
        <div class="social-footer" aria-label="Project links">
          <a class="social-link github-social-link" href="https://github.com/modelstudioai" target="_blank" rel="noopener noreferrer" aria-label="Open Model Studio AI on GitHub">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2C6.48 2 2 6.58 2 12.22c0 4.5 2.87 8.32 6.84 9.67.5.1.68-.22.68-.49 0-.24-.01-1.04-.01-1.88-2.78.62-3.37-1.22-3.37-1.22-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.56 2.35 1.11 2.92.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.05 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.27 2.75 1.05A9.29 9.29 0 0 1 12 6.91c.85 0 1.7.12 2.5.34 1.9-1.32 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.92-2.34 4.79-4.57 5.04.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.8 0 .27.18.59.69.49A10.11 10.11 0 0 0 22 12.22C22 6.58 17.52 2 12 2Z" />
            </svg>
            <span>GitHub</span>
            <span class="github-qr-popover" aria-hidden="true">
              <img src="/static/github-qr.svg" alt="" />
              <span>github.com/modelstudioai</span>
            </span>
          </a>
        </div>
      </footer>
    </main>
    <script src="/static/app.js?v=20260709-cn"></script>
  </body>
</html>
