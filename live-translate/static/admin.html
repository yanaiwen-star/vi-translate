<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理控制台 · vi-translate</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'PingFang SC',system-ui,sans-serif;background:radial-gradient(1200px 600px at 20% 0%,rgba(7,193,96,.10) 0%,transparent 60%),radial-gradient(1000px 500px at 100% 100%,rgba(6,173,86,.08) 0%,transparent 55%),#F7F8FA;color:#1F2329;}
.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(14px);}
.tab-on{background:#07C160;color:#fff;box-shadow:0 8px 20px rgba(7,193,96,.28);}
.tab-off{background:#F1F5F9;color:#475569;}
.card{background:#fff;border:1px solid #E5E6EB;border-radius:18px;box-shadow:0 6px 20px rgba(31,35,41,.04);}
.stat-card{background:linear-gradient(135deg,#fff 0%,#F1FBF6 100%);border:1px solid #E5E6EB;border-radius:16px;padding:18px 20px;}
.stat-label{font-size:12px;color:#646A73;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.stat-value{font-size:30px;font-weight:700;color:#1F2329;margin-top:6px;}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;}
.pill-green{background:#E5F8EF;color:#06AD56;}
.pill-red{background:#FFE9EA;color:#F53F3F;}
.pill-gray{background:#F1F5F9;color:#646A73;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s ease;border:0;}
.btn-primary{background:#07C160;color:#fff;}
.btn-primary:hover{background:#06AD56;}
.btn-primary:disabled{background:#A8E5C5;cursor:not-allowed;}
.btn-ghost{background:#F1F5F9;color:#475569;}
.btn-ghost:hover{background:#E5E7EB;}
.btn-danger{background:#F53F3F;color:#fff;}
.btn-danger:hover{background:#D93434;}
.input{width:100%;padding:9px 12px;border:1px solid #E5E6EB;border-radius:10px;outline:none;font-size:14px;background:#fff;}
.input:focus{border-color:#07C160;box-shadow:0 0 0 3px rgba(7,193,96,.15);}
.table th{font-size:12px;font-weight:700;color:#646A73;text-transform:uppercase;letter-spacing:.04em;padding:12px 14px;border-bottom:1px solid #E5E6EB;text-align:left;background:#FAFBFC;}
.table td{padding:14px;border-bottom:1px solid #F1F5F9;font-size:14px;color:#1F2329;}
.table tr:hover td{background:#FAFBFC;}
.badge-admin{background:#EEF2FF;color:#4F46E5;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;}
.modal-mask{position:fixed;inset:0;background:rgba(31,35,41,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:#fff;border-radius:18px;width:100%;max-width:480px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.2);}
.toast{position:fixed;top:20px;right:20px;z-index:60;display:flex;flex-direction:column;gap:10px;}
.toast-item{padding:12px 18px;border-radius:12px;color:#fff;font-size:14px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.18);animation:slideIn .25s ease;}
.toast-success{background:#07C160;}.toast-error{background:#F53F3F;}.toast-info{background:#1F2329;}
@keyframes slideIn{from{transform:translateY(-12px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body class="min-h-screen">

<div id="toastRoot" class="toast"></div>

<!-- 登录 -->
<div id="loginView" class="min-h-screen flex items-center justify-center p-4">
  <div class="glass w-full max-w-md rounded-3xl shadow-2xl p-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#07C160] text-white text-2xl font-bold mb-3">V</div>
      <div class="text-2xl font-semibold text-gray-900 tracking-tight">vi-translate · 管理后台</div>
      <div class="text-sm text-gray-500 mt-1">仅供管理员使用</div>
    </div>
    <label class="block text-sm text-gray-600 mb-1 font-medium">管理员邮箱</label>
    <input id="loginEmail" type="email" placeholder="admin@example.com" autocomplete="email"
      class="w-full px-4 py-3 rounded-xl border border-gray-200 mb-3 outline-none focus:ring-2 focus:ring-[#07C160] transition" />
    <label class="block text-sm text-gray-600 mb-1 font-medium">密码</label>
    <input id="loginPassword" type="password" placeholder="管理员密码" autocomplete="current-password"
      class="w-full px-4 py-3 rounded-xl border border-gray-200 mb-4 outline-none focus:ring-2 focus:ring-[#07C160] transition" />
    <button id="loginBtn" class="w-full py-3 rounded-xl bg-[#07C160] text-white font-medium hover:bg-[#06AD56] transition shadow-lg shadow-green-600/30 flex items-center justify-center gap-2">
      <span id="loginBtnText">登 录</span>
    </button>
    <div id="loginMsg" class="text-sm text-red-500 mt-3 text-center min-h-[20px]"></div>
  </div>
</div>

<!-- 控制台 -->
<div id="consoleView" class="hidden">
  <header class="glass border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-[#07C160] text-white text-base font-bold">V</div>
        <div>
          <div class="text-base font-semibold text-gray-900">vi-translate 管理后台</div>
          <div class="text-xs text-gray-500">套餐 / 用户 / 用量管理</div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span id="adminEmail" class="text-sm text-gray-600"></span>
        <button id="logoutBtn" class="btn btn-ghost text-sm">退出</button>
      </div>
    </div>
    <div class="max-w-7xl mx-auto px-6 pb-3">
      <div class="flex gap-2">
        <button data-tab="plans" class="admin-tab tab-on flex-1 py-2 rounded-xl font-medium transition">套餐</button>
        <button data-tab="users" class="admin-tab tab-off flex-1 py-2 rounded-xl font-medium transition">用户</button>
        <button data-tab="stats" class="admin-tab tab-off flex-1 py-2 rounded-xl font-medium transition">统计</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-6 space-y-6">

    <!-- 套餐 -->
    <section id="tab-plans" class="space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">套餐管理</h2>
          <p class="text-sm text-gray-500 mt-1">编辑展示中的订阅 / 按量套餐，修改后立即生效</p>
        </div>
        <button id="reloadPlans" class="btn btn-ghost text-sm">刷新</button>
      </div>
      <div id="plansList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- 用户 -->
    <section id="tab-users" class="space-y-4 hidden">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">用户管理</h2>
          <p class="text-sm text-gray-500 mt-1">查看、封禁、解封、调整用户免费配额</p>
        </div>
        <div class="flex items-center gap-2">
          <input id="userSearch" type="search" placeholder="按邮箱搜索" class="input w-64" />
          <button id="searchBtn" class="btn btn-primary text-sm">搜索</button>
        </div>
      </div>
      <div class="card overflow-hidden">
        <table class="w-full table">
          <thead><tr><th>邮箱</th><th>昵称</th><th>角色</th><th>状态</th><th>剩余时长</th><th>累计用量</th><th>累计用时</th><th>最后使用</th><th>注册时间</th><th class="text-right">操作</th></tr></thead>
          <tbody id="usersTbody"><tr><td colspan="10" class="text-center text-gray-400 py-10">加载中…</td></tr></tbody>
        </table>
        <div id="usersPager" class="flex items-center justify-between px-4 py-3 border-t border-gray-100 text-sm text-gray-500"></div>
      </div>
    </section>

    <!-- 统计 -->
    <section id="tab-stats" class="space-y-4 hidden">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">运营统计</h2>
          <p class="text-sm text-gray-500 mt-1">实时快照 · <span id="statsTime"></span></p>
        </div>
        <button id="reloadStats" class="btn btn-ghost text-sm">刷新</button>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <div class="stat-card"><div class="stat-label">注册用户</div><div class="stat-value" id="sUsersTotal">—</div></div>
        <div class="stat-card"><div class="stat-label">封禁用户</div><div class="stat-value text-red-500" id="sUsersBanned">—</div></div>
        <div class="stat-card"><div class="stat-label">管理员</div><div class="stat-value" id="sUsersAdmin">—</div></div>
        <div class="stat-card"><div class="stat-label">活跃订阅</div><div class="stat-value" id="sSubsActive">—</div></div>
        <div class="stat-card"><div class="stat-label">累计用量（字符）</div><div class="stat-value" id="sUsageTotal">—</div></div>
        <div class="stat-card"><div class="stat-label">今日用量（字符）</div><div class="stat-value text-[#07C160]" id="sUsageToday">—</div></div>
        <div class="stat-card"><div class="stat-label">已支付订单</div><div class="stat-value" id="sOrdersPaid">—</div></div>
        <div class="stat-card"><div class="stat-label">已支付金额</div><div class="stat-value">¥<span id="sOrdersAmount">—</span></div></div>
      </div>
      <div class="card p-5">
        <h3 class="text-base font-semibold text-gray-900 mb-3">套餐销售展示</h3>
        <div id="statsPlans" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
      </div>
    </section>

  </main>
</div>

<!-- 编辑套餐 -->
<div id="editPlanModal" class="modal-mask hidden">
  <div class="modal-box">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold">编辑套餐</h3>
      <button id="editPlanClose" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">&times;</button>
    </div>
    <input type="hidden" id="ep_id" />
    <div class="space-y-3">
      <div><label class="text-xs text-gray-500 font-semibold">套餐名称</label><input id="ep_name" class="input mt-1" /></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-gray-500 font-semibold">周期</label>
          <select id="ep_interval" class="input mt-1"><option value="month">月</option><option value="year">年</option><option value="payg">按量</option></select>
        </div>
        <div><label class="text-xs text-gray-500 font-semibold">售价（分）</label><input id="ep_price" type="number" min="0" class="input mt-1" /></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-gray-500 font-semibold">每期字符数</label><input id="ep_chars" type="number" min="0" class="input mt-1" /></div>
        <div><label class="text-xs text-gray-500 font-semibold">每千字超量价（分）</label><input id="ep_overage" type="number" min="0" class="input mt-1" /></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-gray-500 font-semibold">订阅时长（天）</label><input id="ep_duration" type="number" min="0" class="input mt-1" /></div>
        <div class="flex items-end"><label class="flex items-center gap-2 text-sm text-gray-700"><input id="ep_active" type="checkbox" /> 在售</label></div>
      </div>
    </div>
    <div id="ep_msg" class="text-sm text-red-500 mt-3 min-h-[20px]"></div>
    <div class="flex justify-end gap-2 mt-4">
      <button id="ep_cancel" class="btn btn-ghost">取消</button>
      <button id="ep_save" class="btn btn-primary">保存</button>
    </div>
  </div>
</div>

<!-- 配额 -->
<div id="quotaModal" class="modal-mask hidden">
  <div class="modal-box">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold">赠送时长</h3>
      <button id="quotaClose" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">&times;</button>
    </div>
    <input type="hidden" id="q_userId" />
    <div class="mb-2 text-sm text-gray-500">用户：<span id="q_email" class="text-gray-800 font-medium"></span></div>
    <label class="text-xs text-gray-500 font-semibold">赠送时长（分钟，长期有效、用完为止）</label>
    <input id="q_value" type="number" min="1" max="100000" value="60" class="input mt-1" />
    <div class="text-xs text-gray-400 mt-1">约折合 <span id="q_chars_preview">120000</span> 字符额度（1 分钟 ≈ 2000 字符）</div>
    <div id="q_msg" class="text-sm text-red-500 mt-3 min-h-[20px]"></div>
    <div class="flex justify-end gap-2 mt-4">
      <button id="q_cancel" class="btn btn-ghost">取消</button>
      <button id="q_save" class="btn btn-primary">赠送</button>
    </div>
  </div>
</div>

<script>
"use strict";
const ACCESS_KEY="vt_admin_token";
function getAccess(){return localStorage.getItem(ACCESS_KEY);}
function setAccess(t){if(t)localStorage.setItem(ACCESS_KEY,t);}
function clearTokens(){localStorage.removeItem(ACCESS_KEY);localStorage.removeItem("vt_admin_email");}
function decodeJwtPayload(t){try{return JSON.parse(atob((t||"").split(".")[1]||""));}catch(e){return{};}}
function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
function formatDate(s){if(!s)return"";try{const d=new Date(s);return d.toLocaleDateString("zh-CN")+" "+d.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});}catch(e){return s;}}
function toast(msg,kind){kind=kind||"info";const el=document.createElement("div");el.className="toast-item toast-"+kind;el.textContent=msg;document.getElementById("toastRoot").appendChild(el);setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .25s";},2400);setTimeout(()=>el.remove(),2750);}
async function api(path,opts){opts=opts||{};const headers=Object.assign({"Content-Type":"application/json"},opts.headers||{});const t=getAccess();if(t)headers["Authorization"]="Bearer "+t;let r;try{r=await fetch(path,Object.assign({},opts,{headers}));}catch(e){throw new Error("网络错误，请检查连接");}if(r.status===401){clearTokens();showLogin();throw new Error("登录已过期");}let data=null;try{data=await r.json();}catch(e){}if(!r.ok)throw new Error((data&&data.detail)?data.detail:"请求失败 ("+r.status+")");return data;}
function showLogin(){document.getElementById("loginView").classList.remove("hidden");document.getElementById("consoleView").classList.add("hidden");}
function showConsole(){document.getElementById("loginView").classList.add("hidden");document.getElementById("consoleView").classList.remove("hidden");const p=decodeJwtPayload(getAccess()||"");document.getElementById("adminEmail").textContent=p.email||"";loadTab(currentTab());}
function currentTab(){const a=document.querySelector(".admin-tab.tab-on");return a?a.dataset.tab:"plans";}
async function doLogin(){const email=document.getElementById("loginEmail").value.trim();const password=document.getElementById("loginPassword").value;const msgEl=document.getElementById("loginMsg");const btn=document.getElementById("loginBtn");const btnText=document.getElementById("loginBtnText");msgEl.textContent="";if(!email||!password){msgEl.textContent="请填写邮箱和密码";return;}btn.disabled=true;btnText.innerHTML='<span class="spin"></span>&nbsp;登录中…';try{const r=await fetch("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok){msgEl.textContent=d.detail||"登录失败";return;}setAccess(d.access_token);localStorage.setItem("vt_admin_email",email);const p=decodeJwtPayload(d.access_token);if((p.role||"")!=="admin"){clearTokens();msgEl.textContent="此账号不是管理员";return;}showConsole();}catch(e){msgEl.textContent="网络错误，请重试";}finally{btn.disabled=false;btnText.textContent="登 录";}}
function doLogout(){clearTokens();document.getElementById("loginEmail").value="";document.getElementById("loginPassword").value="";document.getElementById("loginMsg").textContent="";showLogin();}
document.getElementById("loginBtn").addEventListener("click",doLogin);
document.getElementById("loginPassword").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
document.getElementById("logoutBtn").addEventListener("click",doLogout);
function switchTab(name){document.querySelectorAll(".admin-tab").forEach(b=>{if(b.dataset.tab===name){b.classList.add("tab-on");b.classList.remove("tab-off");}else{b.classList.remove("tab-on");b.classList.add("tab-off");}});["plans","users","stats"].forEach(t=>{document.getElementById("tab-"+t).classList.toggle("hidden",t!==name);});loadTab(name);}
document.querySelectorAll(".admin-tab").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));
function loadTab(name){if(name==="plans")loadPlans();else if(name==="users")loadUsers();else if(name==="stats")loadStats();}
let _plansCache=[];
async function loadPlans(){const root=document.getElementById("plansList");root.innerHTML='<div class="col-span-full text-center text-gray-400 py-10">加载中…</div>';try{const data=await api("/yueda/plans");_plansCache=data.items||[];renderPlans();}catch(e){root.innerHTML='<div class="col-span-full text-center text-red-400 py-10">'+escapeHtml(e.message)+'</div>';}}
function renderPlans(){const root=document.getElementById("plansList");if(_plansCache.length===0){root.innerHTML='<div class="col-span-full text-center text-gray-400 py-10">暂无套餐</div>';return;}root.innerHTML=_plansCache.map(p=>{const price=(p.price_cents/100).toFixed(2);const perK=(p.overage_price_per_kchar/100).toFixed(2);const periodLabel=p.interval==="month"?"/ 月":p.interval==="year"?"/ 年":"";return `<div class="card p-5"><div class="flex items-start justify-between mb-2"><div><div class="text-base font-semibold text-gray-900">${escapeHtml(p.name)}</div><div class="text-xs text-gray-400 mt-0.5">id: ${escapeHtml(p.id)}</div></div>${p.active?'<span class="pill pill-green">在售</span>':'<span class="pill pill-gray">已下架</span>'}</div><div class="flex items-baseline gap-1 mt-3"><span class="text-3xl font-bold text-gray-900">¥${price}</span><span class="text-sm text-gray-500">${periodLabel}</span></div><div class="mt-3 text-sm text-gray-600 space-y-1"><div>每期字符：<span class="text-gray-900 font-medium">${(p.chars_per_period||0).toLocaleString()}</span></div><div>超量：<span class="text-gray-900 font-medium">¥${perK} / 千字</span></div><div>时长：<span class="text-gray-900 font-medium">${p.duration_days||0} 天</span></div></div><div class="mt-4 flex gap-2"><button class="btn btn-ghost text-xs flex-1" onclick="openEditPlan('${p.id}')">编辑</button></div></div>`;}).join("");}
document.getElementById("reloadPlans").addEventListener("click",loadPlans);
function openEditPlan(id){const p=_plansCache.find(x=>x.id===id);if(!p)return;document.getElementById("ep_id").value=p.id;document.getElementById("ep_name").value=p.name||"";document.getElementById("ep_interval").value=p.interval||"month";document.getElementById("ep_price").value=p.price_cents;document.getElementById("ep_chars").value=p.chars_per_period;document.getElementById("ep_overage").value=p.overage_price_per_kchar;document.getElementById("ep_duration").value=p.duration_days;document.getElementById("ep_active").checked=!!p.active;document.getElementById("ep_msg").textContent="";document.getElementById("editPlanModal").classList.remove("hidden");}
function closeEditPlan(){document.getElementById("editPlanModal").classList.add("hidden");}
document.getElementById("editPlanClose").addEventListener("click",closeEditPlan);
document.getElementById("ep_cancel").addEventListener("click",closeEditPlan);
document.getElementById("ep_save").addEventListener("click",async()=>{const id=document.getElementById("ep_id").value;const body={name:document.getElementById("ep_name").value.trim(),interval:document.getElementById("ep_interval").value,price_cents:parseInt(document.getElementById("ep_price").value||"0",10),chars_per_period:parseInt(document.getElementById("ep_chars").value||"0",10),overage_price_per_kchar:parseInt(document.getElementById("ep_overage").value||"0",10),duration_days:parseInt(document.getElementById("ep_duration").value||"0",10),active:document.getElementById("ep_active").checked};const msgEl=document.getElementById("ep_msg");msgEl.textContent="";if(!body.name){msgEl.textContent="请填写套餐名称";return;}try{await api("/yueda/plans/"+encodeURIComponent(id),{method:"PUT",body:JSON.stringify(body)});toast("套餐已更新","success");closeEditPlan();loadPlans();}catch(e){msgEl.textContent=e.message;}});
let _usersPage=1,_usersSize=20,_usersSearch="";
async function loadUsers(page){if(page)_usersPage=page;const tbody=document.getElementById("usersTbody");const pager=document.getElementById("usersPager");tbody.innerHTML='<tr><td colspan="10" class="text-center text-gray-400 py-10">加载中…</td></tr>';try{const q=new URLSearchParams();q.set("page",_usersPage);q.set("size",_usersSize);if(_usersSearch)q.set("search",_usersSearch);const data=await api("/yueda/users?"+q.toString());if(!data.items||data.items.length===0){tbody.innerHTML='<tr><td colspan="10" class="text-center text-gray-400 py-10">没有用户</td></tr>';pager.textContent="";return;}tbody.innerHTML=data.items.map(u=>`<tr><td class="font-medium">${escapeHtml(u.email)}</td><td class="text-gray-700">${escapeHtml(u.nickname||'—')}</td><td>${u.role==="admin"?'<span class="badge-admin">管理员</span>':'<span class="pill pill-gray">用户</span>'}</td><td>${u.is_banned?'<span class="pill pill-red">封禁</span>':'<span class="pill pill-green">正常</span>'}</td><td>${(u.minutes_left||0)} 分钟</td><td>${(u.used_chars_total||0).toLocaleString()} 字</td><td>${(u.used_minutes_total||0)} 分钟</td><td class="text-xs text-gray-500">${u.last_used_at?formatDate(u.last_used_at):'—'}</td><td class="text-xs text-gray-500">${formatDate(u.created_at)}</td><td class="text-right"><div class="inline-flex gap-1"><button class="btn btn-ghost text-xs" onclick="openAddMinutes('${u.id}','${escapeAttr(u.email)}')">赠送时长</button>${u.is_banned?`<button class="btn btn-ghost text-xs" onclick="toggleBan('${u.id}',false)">解封</button>`:`<button class="btn btn-danger text-xs" onclick="toggleBan('${u.id}',true)">封禁</button>`}</div></td></tr>`).join("");const totalPages=Math.max(1,Math.ceil(data.total/_usersSize));pager.innerHTML=`<span>共 ${data.total} 条 · 第 ${data.page} / ${totalPages} 页</span><div class="flex gap-2"><button class="btn btn-ghost text-xs" ${data.page<=1?"disabled":""} onclick="loadUsers(${data.page-1})">上一页</button><button class="btn btn-ghost text-xs" ${data.page>=totalPages?"disabled":""} onclick="loadUsers(${data.page+1})">下一页</button></div>`;}catch(e){tbody.innerHTML='<tr><td colspan="10" class="text-center text-red-400 py-10">'+escapeHtml(e.message)+'</td></tr>';}}
document.getElementById("searchBtn").addEventListener("click",()=>{_usersSearch=document.getElementById("userSearch").value.trim();_usersPage=1;loadUsers();});
document.getElementById("userSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){_usersSearch=document.getElementById("userSearch").value.trim();_usersPage=1;loadUsers();}});
async function toggleBan(userId,ban){const path=ban?"/yueda/users/"+userId+"/ban":"/yueda/users/"+userId+"/unban";try{await api(path,{method:"POST",body:JSON.stringify({})});toast(ban?"已封禁":"已解封","success");loadUsers();}catch(e){toast(e.message,"error");}}
function openAddMinutes(userId,email){document.getElementById("q_userId").value=userId;document.getElementById("q_email").textContent=email;var qv=document.getElementById("q_value");qv.value=60;document.getElementById("q_chars_preview").textContent=(60*2000).toLocaleString();document.getElementById("q_msg").textContent="";document.getElementById("quotaModal").classList.remove("hidden");}
function closeQuota(){document.getElementById("quotaModal").classList.add("hidden");}
document.getElementById("quotaClose").addEventListener("click",closeQuota);
document.getElementById("q_cancel").addEventListener("click",closeQuota);
document.getElementById("q_value").addEventListener("input",function(){var v=parseInt(this.value||"0",10)||0;document.getElementById("q_chars_preview").textContent=(v*2000).toLocaleString();});
document.getElementById("q_save").addEventListener("click",async()=>{const uid=document.getElementById("q_userId").value;const v=parseInt(document.getElementById("q_value").value||"0",10);const msgEl=document.getElementById("q_msg");msgEl.textContent="";if(!v||v<=0){msgEl.textContent="请输入大于 0 的分钟数";return;}try{await api("/yueda/users/"+uid+"/add-minutes",{method:"POST",body:JSON.stringify({minutes:v})});toast("已赠送 "+v+" 分钟","success");closeQuota();loadUsers();}catch(e){msgEl.textContent=e.message;}});
async function loadStats(){try{const d=await api("/yueda/stats");document.getElementById("sUsersTotal").textContent=(d.users?.total||0).toLocaleString();document.getElementById("sUsersBanned").textContent=(d.users?.banned||0).toLocaleString();document.getElementById("sUsersAdmin").textContent=(d.users?.admins||0).toLocaleString();document.getElementById("sSubsActive").textContent=(d.subscriptions?.active||0).toLocaleString();document.getElementById("sUsageTotal").textContent=(d.usage?.chars_total||0).toLocaleString();document.getElementById("sUsageToday").textContent=(d.usage?.chars_today||0).toLocaleString();document.getElementById("sOrdersPaid").textContent=(d.orders?.paid||0).toLocaleString();document.getElementById("sOrdersAmount").textContent=((d.orders?.amount_cents||0)/100).toFixed(2);const plansRoot=document.getElementById("statsPlans");if(d.plans&&d.plans.length){plansRoot.innerHTML=d.plans.map(p=>`<div class="card p-4"><div class="text-sm text-gray-700 font-medium">${escapeHtml(p.name)}</div><div class="text-xs text-gray-500 mt-1">¥${(p.price_cents/100).toFixed(2)} · ${(p.chars_per_period||0).toLocaleString()} 字符</div><div class="mt-2">${p.active?'<span class="pill pill-green">在售</span>':'<span class="pill pill-gray">已下架</span>'}</div></div>`).join("");}else{plansRoot.innerHTML='<div class="text-sm text-gray-400">暂无套餐</div>';}document.getElementById("statsTime").textContent=formatDate(d.generated_at);}catch(e){toast("统计加载失败: "+e.message,"error");}}
document.getElementById("reloadStats").addEventListener("click",loadStats);
(function init(){if(getAccess()){const p=decodeJwtPayload(getAccess());if((p.role||"")==="admin"){showConsole();return;}}showLogin();})();
</script>
