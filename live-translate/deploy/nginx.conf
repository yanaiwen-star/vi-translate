# ============================================================
# vi-translate v2 - nginx 反向代理
# 模式: 当前仅 HTTP 80（IP 直连可用）；HTTPS 443 备案后启用
# 限流: API 60r/m、WS 20r/m、auth 10r/m（IP 维度）
# ============================================================

# 限流 key 共享内存（10MB 约能容纳 16 万 IP）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# access log 脱敏：不记 query string（可能含 token/code/state）
# log_format 必须在 http 顶层，不能在 server 块里
log_format vi_main '$remote_addr - [$time_local] '
                   '"$request_method $uri" $status $body_bytes_sent '
                   '"$http_user_agent" rt=$request_time';

# upstream
upstream app {
    server app:8000;
    keepalive 32;
}

# 隐藏 nginx 版本
server_tokens off;

# ---- HTTP 80 ----
# 根域名 yuexunfanyi.com 统一 301 跳转到 www.yuexunfanyi.com（SEO 规范 + 单源）
server {
    listen 80;
    server_name yuexunfanyi.com;
    # 上 HTTPS 后改为 https://
    return 301 http://www.yuexunfanyi.com$request_uri;
}

server {
    listen 80 default_server;
    server_name www.yuexunfanyi.com;

    # 大请求体（WS 升级前的初始 HTTP 请求）
    client_max_body_size 8m;
    client_body_timeout 30s;

    # 通用安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS 仅在 HTTPS 块（HTTP 下会被忽略）
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/access.log vi_main;
    error_log  /var/log/nginx/error.log warn;

    # 健康检查（公开，无限流）
    location = /healthz {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 认证/登录/支付接口 - 严格限流
    location ~ ^/(auth|pay)/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 升级（实时翻译代理）
    location /ws/ {
        limit_req zone=ws_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;     # WS 长连接保活 1h
        proxy_send_timeout 3600s;
    }

    # API 路由 - 通用限流
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源 - 缓存 + 无限流
    location /static/ {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 10m;
        expires 10m;
    }

    # 根路径与其他
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

