<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人中心 · vi-translate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/profile.css" />
</head>
<body>

<!-- 顶部 Navbar -->
<header class="sticky top-0 z-30 bg-white/85 backdrop-blur border-b border-slate-100">
  <div class="max-w-4xl mx-auto px-5 py-3 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2 text-[15px] font-semibold text-ink hover:opacity-80 transition">
      <span class="grid place-items-center w-8 h-8 rounded-xl brand-btn text-white text-[15px]">悦</span>
      <span>悦迅翻译</span>
    </a>
    <nav class="flex items-center gap-2 sm:gap-4 text-[14px]">
      <button id="logoutBtn" class="text-slate-500 hover:text-red-500 transition text-[13px]">退出</button>
    </nav>
  </div>
</header>

<!-- 主体内容 -->
<main class="max-w-4xl mx-auto px-5 py-8 sm:py-12">

  <!-- 未登录提示 -->
  <div id="notLogged" class="card hidden text-center py-12 fade-in">
    <div class="text-5xl mb-3">🔒</div>
    <h2 class="text-xl font-semibold mb-2">尚未登录</h2>
    <p class="text-slate-500 mb-6 text-sm">登录后可查看账号信息、配额与已购套餐</p>
    <a href="/login.html" class="inline-block brand-btn text-white px-6 py-2.5 rounded-full font-medium text-sm">前往登录</a>
  </div>

  <!-- 已登录主体 -->
  <div id="loggedIn" class="hidden fade-in">

    <!-- 欢迎语 -->
    <section class="flex items-center gap-4 mb-8">
      <div id="avatar" class="avatar-circle">?</div>
      <div class="flex-1 min-w-0">
        <div class="text-[13px] text-slate-500" id="greeting">你好</div>
        <h1 class="text-2xl font-bold tracking-tight truncate" id="nickname">访客</h1>
        <div class="flex items-center gap-2 mt-1.5 text-[12px]">
          <span id="loginTypePill" class="pill pill-gray">账号</span>
          <span id="memberPill" class="pill pill-green hidden">已购套餐</span>
        </div>
      </div>
    </section>

    <!-- 配额双卡片 -->
    <section class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
      <div class="card">
        <div class="text-[13px] text-slate-500 mb-2">同传剩余额度</div>
        <div class="flex items-baseline gap-2 mb-1">
          <span id="quotaMinutes" class="stat-num brand">--</span>
          <span class="text-slate-400 text-sm">分钟</span>
        </div>
        <div class="text-[12px] text-slate-400 mt-2">每日免费 20 分钟，次日 0 点自动重置</div>
      </div>
      <div class="card">
        <div class="text-[13px] text-slate-500 mb-2">语音包余额</div>
        <div class="flex items-baseline gap-2 mb-1">
          <span id="packMinutes" class="stat-num">--</span>
          <span class="text-slate-400 text-sm">分钟</span>
        </div>
        <div class="text-[12px] text-slate-400 mt-2">购买后长期有效</div>
      </div>
    </section>

    <!-- 我的套餐 -->
    <section class="card mb-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-[15px] font-semibold">我的套餐</h2>
        <span class="text-[12px] text-slate-400">最近 5 笔</span>
      </div>
      <div id="ordersList" class="space-y-2">
        <div class="skeleton h-14 w-full">占位</div>
      </div>
    </section>

    <!-- 购买套餐（替代独立 /pricing 页面） -->
    <section class="card mb-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-[15px] font-semibold">购买套餐</h2>
        <span class="text-[12px] text-slate-400">按需购买 · 长期有效</span>
      </div>
      <div id="plansGrid" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="skeleton h-32 w-full">占位</div>
        <div class="skeleton h-32 w-full">占位</div>
        <div class="skeleton h-32 w-full">占位</div>
      </div>
      <p class="text-[12px] text-slate-400 mt-3">支付后分钟自动到账，可立即开始翻译</p>
    </section>

    <!-- 账号设置 -->
    <section class="card mb-4">
      <h2 class="text-[15px] font-semibold mb-3">账号设置</h2>

      <!-- 昵称 -->
      <div class="setting-row">
        <div class="setting-label">昵称</div>
        <div class="setting-value" id="nicknameVal">—</div>
        <button class="setting-btn" data-action="edit-nickname">修改</button>
      </div>

      <!-- 手机号 -->
      <div class="setting-row">
        <div class="setting-label">手机号</div>
        <div class="setting-value" id="phoneVal">—</div>
        <button class="setting-btn" data-action="edit-phone">绑定 / 换绑</button>
      </div>

      <!-- 登录方式（只读） -->
      <div class="setting-row">
        <div class="setting-label">登录方式</div>
        <div class="setting-value" id="loginMethodVal">—</div>
        <span class="text-slate-300 text-[12px]">不可修改</span>
      </div>

      <!-- 用户 ID（只读） -->
      <div class="setting-row">
        <div class="setting-label">用户 ID</div>
        <div class="setting-value font-mono text-[12px] text-slate-400" id="userIdVal">—</div>
        <span class="text-slate-300 text-[12px]">系统分配</span>
      </div>
    </section>

    <!-- 主操作 -->
    <section class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <a href="/dialog" class="brand-btn text-white text-center py-3 rounded-2xl font-semibold text-[15px]">
        🎙️ 开始翻译
      </a>
      <button id="logoutBtn2" class="bg-white border-2 border-slate-200 text-slate-500 py-3 rounded-2xl font-medium text-[14px] hover:border-red-300 hover:text-red-500 transition">
        退出登录
      </button>
    </section>

    <p class="text-center text-[12px] text-slate-400 mt-8">
      vi-translate · 悦迅越南语实时同传
    </p>
  </div>
</main>

<!-- 编辑昵称 Modal -->
<div id="modalNickname" class="modal-mask hidden">
  <div class="modal-card">
    <h3 class="text-lg font-semibold mb-3">修改昵称</h3>
    <input id="nicknameInput" type="text" maxlength="20" placeholder="新昵称（不超过 20 字）" class="modal-input" />
    <p class="text-[12px] text-slate-400 mt-2">昵称会显示在你的头像和订单旁</p>
    <div class="flex gap-2 mt-4">
      <button class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50" data-action="modal-close">取消</button>
      <button id="nicknameSaveBtn" class="flex-1 py-2.5 rounded-xl brand-btn text-white font-medium">保存</button>
    </div>
  </div>
</div>

<!-- 绑定 / 换绑手机号 Modal -->
<div id="modalPhone" class="modal-mask hidden">
  <div class="modal-card">
    <h3 class="text-lg font-semibold mb-3" id="phoneModalTitle">绑定手机号</h3>

    <!-- 图形验证码 -->
    <label class="modal-label">图形验证码</label>
    <div class="flex gap-2 mb-3">
      <input id="phoneCaptchaInput" type="text" maxlength="6" autocomplete="off" placeholder="4 位字符" class="modal-input flex-1" />
      <img id="phoneCaptchaImg" src="" alt="点击换一张" title="点击换一张"
           style="width:120px;height:42px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:#fff;" />
    </div>

    <label class="modal-label">手机号</label>
    <input id="phoneInput" type="tel" inputmode="numeric" maxlength="11" placeholder="11 位手机号" class="modal-input mb-3" />

    <label class="modal-label">短信验证码</label>
    <div class="flex gap-2 mb-3">
      <input id="phoneCodeInput" type="text" inputmode="numeric" maxlength="6" placeholder="6 位短信验证码" class="modal-input flex-1" />
      <button id="phoneSendCodeBtn" class="px-4 py-2.5 rounded-xl border border-brand text-brand text-[13px] hover:bg-green-50 transition whitespace-nowrap">获取验证码</button>
    </div>

    <p id="phoneMsg" class="text-[12px] text-slate-500 min-h-[18px]"></p>

    <div class="flex gap-2 mt-4">
      <button class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50" data-action="modal-close">取消</button>
      <button id="phoneBindBtn" class="flex-1 py-2.5 rounded-xl brand-btn text-white font-medium">确认绑定</button>
    </div>
  </div>
</div>

<!-- 通用 Toast -->
<div id="toast" class="toast hidden"></div>

<script src="/static/auth.js"></script>
<script>
  const CHARS_PER_MINUTE = 2000;
  const PLAN_TAG = { pack_small: '轻度尝鲜', pack_medium: '最划算', pack_large: '重度首选' };

  function greeting() {
    const h = new Date().getHours();
    if (h < 6) return '夜深了';
    if (h < 11) return '早上好';
    if (h < 14) return '中午好';
    if (h < 18) return '下午好';
    if (h < 22) return '晚上好';
    return '夜深了';
  }
  function formatTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  function yuan(c) { return c == null ? '—' : (c / 100).toFixed(2).replace(/\.00$/, '') + ' 元'; }

  // 用 vtAuth.fetch 替代裸 fetch：自动 refresh token
  async function fetchJSON(url) {
    const r = await vtAuth.fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  // Toast
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(text, kind) {
    toastEl.textContent = text || '';
    toastEl.className = 'toast' + (kind ? ' toast-' + kind : '');
    toastEl.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.add('hidden'), 2400);
  }

  function logout() {
    if (!confirm('确定要退出登录吗？')) return;
    vtAuth.logout();
  }
  document.getElementById('logoutBtn').onclick = logout;
  document.getElementById('logoutBtn2').onclick = logout;

  // 监听 refresh token 失效事件 → 跳登录页
  window.addEventListener('vt:auth-expired', () => {
    toast('登录已过期，请重新登录', 'err');
    setTimeout(() => location.href = '/login.html?next=/profile', 1200);
  });

  // ============ 渲染：账号 / 配额 / 订单 ============
  async function renderAccount() {
    let me, quota, orders;
    try {
      [me, quota, orders] = await Promise.all([
        fetchJSON('/auth/me'),
        fetchJSON('/billing/quota'),
        fetchJSON('/billing/orders'),
      ]);
    } catch (e) {
      console.error(e);
      document.getElementById('notLogged').classList.remove('hidden');
      document.getElementById('notLogged').querySelector('h2').textContent = '加载失败';
      document.getElementById('notLogged').querySelector('p').textContent = '网络异常，请刷新重试';
      return;
    }

    const nickname = me.nickname || '微信用户';
    const initial = nickname.charAt(0).toUpperCase();
    document.getElementById('avatar').textContent = initial;
    document.getElementById('greeting').textContent = greeting() + '，';
    document.getElementById('nickname').textContent = nickname;

    const loginTypePill = document.getElementById('loginTypePill');
    if (me.wechat_bound) {
      loginTypePill.textContent = '微信登录';
      loginTypePill.className = 'pill pill-green';
    } else {
      loginTypePill.textContent = '邮箱登录';
    }

    const totalMin = Math.floor((quota.available_chars || 0) / CHARS_PER_MINUTE);
    document.getElementById('quotaMinutes').textContent = totalMin;
    const packMin = Math.max(0, totalMin - 20);
    document.getElementById('packMinutes').textContent = packMin;
    document.getElementById('memberPill').classList.toggle('hidden', packMin <= 0);

    const ordersList = document.getElementById('ordersList');
    const paid = (orders || []).filter(o => o.status === 'paid' || o.status === 'fulfilled');
    if (paid.length === 0) {
      ordersList.innerHTML = `<div class="text-center py-6 text-slate-400 text-[13px]">还没有购买过套餐，可点击下方「购买套餐」</div>`;
    } else {
      ordersList.innerHTML = paid.slice(0, 5).map(o => {
        const name = o.plan_name || (o.plan_code === 'pack_small' ? '小包' : o.plan_code === 'pack_medium' ? '中包' : o.plan_code === 'pack_large' ? '大包' : '套餐');
        return `
          <div class="flex items-center justify-between py-2.5 px-3 rounded-xl hover:bg-slate-50 transition">
            <div>
              <div class="text-[14px] font-medium">${name} <span class="text-slate-400 text-[12px] ml-2">${(o.chars_granted / CHARS_PER_MINUTE).toFixed(0)} 分钟</span></div>
              <div class="text-[12px] text-slate-400 mt-0.5">${formatTime(o.paid_at || o.created_at)}</div>
            </div>
            <div class="text-right">
              <div class="text-[14px] font-semibold text-[#f5762e]">${yuan(o.amount_cents)}</div>
              <div class="text-[11px] text-green-600 mt-0.5">✓ 已支付</div>
            </div>
          </div>`;
      }).join('');
    }

    document.getElementById('nicknameVal').textContent = nickname;
    document.getElementById('phoneVal').textContent = me.phone || '未绑定';
    document.getElementById('loginMethodVal').textContent = me.wechat_bound ? '微信扫码' : (me.email ? '邮箱密码' : '其他');
    document.getElementById('userIdVal').textContent = (me.id || '').substring(0, 16) + '...';
  }

  // ============ 渲染：套餐购买 ============
  async function renderPlans() {
    const grid = document.getElementById('plansGrid');
    let plans;
    try {
      plans = await fetchJSON('/billing/plans');
    } catch (e) {
      grid.innerHTML = `<div class="col-span-3 text-center py-6 text-slate-400 text-[13px]">套餐加载失败</div>`;
      return;
    }
    const visible = (plans || []).filter(p => p.interval === 'payg' && p.price_cents > 0)
                                  .sort((a, b) => a.chars_per_period - b.chars_per_period);
    if (visible.length === 0) {
      grid.innerHTML = `<div class="col-span-3 text-center py-6 text-slate-400 text-[13px]">暂无可购买套餐</div>`;
      return;
    }
    grid.innerHTML = visible.map(p => {
      const tag = PLAN_TAG[p.code] || '按量购买';
      const minutes = p.chars_per_period || 0;
      const perMin = minutes ? (p.price_cents / 100 / minutes).toFixed(2).replace(/0+$/, '').replace(/\.$/, '') : '—';
      const isMedium = p.code === 'pack_medium';
      return `
        <div class="plan-card ${isMedium ? 'featured' : ''}">
          ${isMedium ? '<div class="ribbon">推荐</div>' : ''}
          <div class="text-[14px] font-semibold">${p.name}</div>
          <div class="plan-tag">${tag}</div>
          <div class="plan-min">${minutes} <span class="plan-min-unit">分钟</span></div>
          <div class="plan-permin">约 ${perMin} 元/分钟</div>
          <button class="plan-buy" data-plan="${p.id}" data-code="${p.code}" ${isMedium ? '' : ''}>
            ¥${yuan(p.price_cents).replace(' 元','')} 购买
          </button>
        </div>`;
    }).join('');
    grid.querySelectorAll('.plan-buy').forEach(btn => {
      btn.onclick = () => buyPlan(btn.dataset.plan, btn.dataset.code);
    });
  }

  // ============ 购买流程 ============
  // 网页端目前没有原生支付通道：下单成功后引导用户用微信小程序扫码完成支付
  async function buyPlan(planId, planCode) {
    if (!confirm(`确认购买「${planCode === 'pack_small' ? '小包' : planCode === 'pack_medium' ? '中包' : '大包'}」？\n支付通道：网页端当前仅支持微信小程序扫码支付。`)) return;
    try {
      // 网页端没有 wx.login code，用 mp_jsapi 通道（公众号 OAuth），但这里简化处理：
      // 直接调 /billing/create_order 拿 out_trade_no，然后跳到 /checkout.html 显示小程序码
      const r = await vtAuth.post('/billing/create_order', { plan_id: planId, pay_type: 'mp_jsapi' });
      if (r && r.out_trade_no) {
        location.href = '/checkout.html?out_trade_no=' + encodeURIComponent(r.out_trade_no);
      } else {
        toast(r.detail || '下单失败，请稍后重试', 'err');
      }
    } catch (e) {
      console.error(e);
      toast('下单失败：' + (e.message || '网络异常'), 'err');
    }
  }

  // ============ 修改昵称 ============
  const modalNickname = document.getElementById('modalNickname');
  document.querySelector('[data-action="edit-nickname"]').onclick = () => {
    document.getElementById('nicknameInput').value = document.getElementById('nicknameVal').textContent.trim();
    modalNickname.classList.remove('hidden');
    setTimeout(() => document.getElementById('nicknameInput').focus(), 50);
  };
  document.getElementById('nicknameSaveBtn').onclick = async () => {
    const v = (document.getElementById('nicknameInput').value || '').trim();
    if (!v) { toast('昵称不能为空', 'err'); return; }
    if (v.length > 20) { toast('昵称不超过 20 字', 'err'); return; }
    try {
      const r = await vtAuth.post('/auth/profile', { nickname: v });
      if (r && 'nickname' in r) {
        toast('已保存', 'ok');
        modalNickname.classList.add('hidden');
        renderAccount();  // 刷新
      } else {
        toast(r.detail || '保存失败', 'err');
      }
    } catch (e) {
      toast('保存失败：' + (e.message || ''), 'err');
    }
  };

  // ============ 绑定 / 换绑手机号 ============
  const modalPhone = document.getElementById('modalPhone');
  let phoneCaptchaId = '';
  document.querySelector('[data-action="edit-phone"]').onclick = () => {
    const current = document.getElementById('phoneVal').textContent.trim();
    document.getElementById('phoneModalTitle').textContent = current === '未绑定' ? '绑定手机号' : '换绑手机号';
    document.getElementById('phoneInput').value = current === '未绑定' ? '' : current;
    document.getElementById('phoneCodeInput').value = '';
    document.getElementById('phoneCaptchaInput').value = '';
    document.getElementById('phoneMsg').textContent = '';
    document.getElementById('phoneSendCodeBtn').disabled = false;
    document.getElementById('phoneSendCodeBtn').textContent = '获取验证码';
    loadPhoneCaptcha();
    modalPhone.classList.remove('hidden');
  };

  async function loadPhoneCaptcha() {
    try {
      const r = await fetch('/auth/captcha');
      const d = await r.json();
      phoneCaptchaId = d.captcha_id || '';
      document.getElementById('phoneCaptchaImg').src = d.image || '';
    } catch (e) { console.error(e); }
  }
  document.getElementById('phoneCaptchaImg').onclick = loadPhoneCaptcha;

  document.getElementById('phoneSendCodeBtn').onclick = async () => {
    const phone = document.getElementById('phoneInput').value.trim();
    const captcha = document.getElementById('phoneCaptchaInput').value.trim();
    if (!/^1[3-9]\d{9}$/.test(phone)) { toast('手机号格式不正确', 'err'); return; }
    if (!captcha) { toast('请先输入图形验证码', 'err'); return; }
    if (!phoneCaptchaId) { toast('图形验证码未加载', 'err'); loadPhoneCaptcha(); return; }
    const btn = document.getElementById('phoneSendCodeBtn');
    btn.disabled = true;
    try {
      const r = await vtAuth.post('/auth/sms/send', { phone, captcha_id: phoneCaptchaId, captcha_answer: captcha });
      const d = await r.json();
      if (!r.ok) { toast(d.detail || '发送失败', 'err'); loadPhoneCaptcha(); btn.disabled = false; return; }
      document.getElementById('phoneMsg').innerHTML = d.dev_code
        ? `开发模式验证码：<b style="color:#06B257">${d.dev_code}</b>`
        : '验证码已发送，请查收短信';
      document.getElementById('phoneCaptchaInput').value = '';
      loadPhoneCaptcha();
      // 60s 倒计时
      let left = 60;
      btn.textContent = left + 's';
      const t = setInterval(() => {
        left -= 1;
        if (left <= 0) { clearInterval(t); btn.disabled = false; btn.textContent = '获取验证码'; }
        else btn.textContent = left + 's';
      }, 1000);
    } catch (e) { toast('发送失败', 'err'); loadPhoneCaptcha(); btn.disabled = false; }
  };

  document.getElementById('phoneBindBtn').onclick = async () => {
    const phone = document.getElementById('phoneInput').value.trim();
    const code = document.getElementById('phoneCodeInput').value.trim();
    if (!/^1[3-9]\d{9}$/.test(phone)) { toast('手机号格式不正确', 'err'); return; }
    if (!code) { toast('请输入短信验证码', 'err'); return; }
    try {
      const r = await vtAuth.post('/auth/sms/bind', { phone, code });
      const d = await r.json();
      if (!r.ok) { toast(d.detail || '绑定失败', 'err'); return; }
      toast('绑定成功', 'ok');
      modalPhone.classList.add('hidden');
      renderAccount();  // 刷新
    } catch (e) { toast('绑定失败', 'err'); }
  };

  // 关闭所有 modal
  document.querySelectorAll('[data-action="modal-close"]').forEach(b => {
    b.onclick = () => {
      modalNickname.classList.add('hidden');
      modalPhone.classList.add('hidden');
    };
  });
  // 点击遮罩关闭
  [modalNickname, modalPhone].forEach(m => {
    m.onclick = (e) => { if (e.target === m) m.classList.add('hidden'); };
  });

  // ============ 启动 ============
  (async function init() {
    if (!vtAuth.getToken()) {
      document.getElementById('notLogged').classList.remove('hidden');
      return;
    }
    document.getElementById('loggedIn').classList.remove('hidden');
    await Promise.all([renderAccount(), renderPlans()]);
  })();
</script>
</body>
</html>
